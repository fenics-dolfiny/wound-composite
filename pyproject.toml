[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "wound_composite"
version = "0.0.0"
dependencies = ["numpy"]
requires-python = ">=3.11"
authors = [
  { name = "Paul T. Kühner", email = "paul.kuehner@uni.lu" },
  { name = "Michal Habera", email = "michal.habera@uni.lu" },
  { name = "Andreas Zilian", email = "andreas.zilian@uni.lu" }
]
maintainers = [{ name = "Paul T. Kühner", email = "paul.kuehner@uni.lu" }]
description = ""

keywords = [""]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python",
]

[project.urls]
Repository = "https://github.com/fenics-dolfiny/wound-composite.git"
"Bug Tracker" = "https://github.com/fenics-dolfiny/wound-composite/issues"

[tool.setuptools]
packages = ["wound_composite"]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
  "D",  # pydocstyle
  "E",  # pycodestyle
  "W",  # pycodestyle
  "F",  # pyflakes
  "I",  # isort - use standalone isort
  "RUF",  # Ruff-specific rules
  "UP",  # pyupgrade
  "ICN",  # flake8-import-conventions
  "NPY",  # numpy-specific rules
  "FLY",  # use f-string not static joins
]
ignore = [
  "D1",  # undocumented
  "D203",  # incompatible with D211 `no-blank-line-before-class`
  "D213",  # incomptabile with D212 `multi-line-summary-first-line`
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 75

[dependency-groups]
format = ["typos", "ruff"]
