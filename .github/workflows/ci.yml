name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily at 6am

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 🔎
    runs-on: ubuntu-latest
    container: dolfiny/dolfiny:nightly
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install -y gitleaks
      - run: pip install --group check
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make check

  format:
    name: ✨
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
      - run: npm install prettier prettier-plugin-toml
      - run: uv sync --group format
      - run: make format

  test:
    name: ⚙️
    needs: [format]
    runs-on: ${{ matrix.os }}
    container: dolfiny/dolfiny:nightly
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    env:
      PYTHON: python3
    steps:
      - uses: actions/checkout@v6
      - run: pip install --group test
      - if: matrix.os == 'ubuntu-24.04'
        run: make coverage COVERAGE_REPORT="$GITHUB_STEP_SUMMARY"
      - if: matrix.os != 'ubuntu-24.04'
        run: make test

  status-check:
    name: ☑️
    if: always()
    needs: [check, format, test]
    runs-on: ubuntu-latest
    steps:
      - if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
